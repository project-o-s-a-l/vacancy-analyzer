[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-analyzer"
version = "0.1.0"
description = "Explainable personal job recommendations from public vacancy sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "SQLAlchemy[asyncio]>=2.0.38,<2.1",
    "asyncpg>=0.31,<1",
    "alembic>=1.14,<2",
    "PyYAML>=6.0.2,<7",
    "aiogram>=3.31,<4",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3,<7",
    "pymorphy3>=2,<3",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<2"]
semantic = ["onnxruntime>=1.23,<2", "tokenizers>=0.22,<0.24", "psutil>=7,<8", "truststore>=0.10,<1"]

[project.scripts]
vacancy-analyzer = "jobs.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["collectors.*", "vacancy_source_adapters*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.jsonl*", "**/*.jsonl*", "*.lease", "**/*.lease", ".va-log-budget.lock", "**/.va-log-budget.lock"]

[tool.setuptools.data-files]
"share/vacancy-analyzer/evaluation" = [
    "config/evaluation/benchmark.yaml",
    "config/evaluation/protocol.json",
    "config/evaluation/review.html",
    "docs/evaluation/REVIEW.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local-tmp", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
