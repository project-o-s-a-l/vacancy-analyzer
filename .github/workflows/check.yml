name: Project checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'pip>=25.1' && python -m pip install -c requirements/linux-py312.txt --group dev -e '.[ml,semantic]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q -m 'not postgres'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: vacancy_analyzer_test
          POSTGRES_USER: va_test
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://va_test:disposable-test-only@127.0.0.1:5432/vacancy_analyzer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'pip>=25.1' && python -m pip install -c requirements/linux-py312.txt --group dev -e '.[ml,semantic]'
      - run: python scripts/check_postgres_migrations.py
      - run: python -m pytest -q -m postgres
      - run: docker build --tag vacancy-analyzer:ci .
      - run: docker run --rm vacancy-analyzer:ci --help
